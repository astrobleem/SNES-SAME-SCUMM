[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "same-vdp-lab"
version = "0.1.0"
description = "CPU-independent Genesis VDP to SNES PPU translation laboratory"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
same-vdp = "same_vdp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
